name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/zealous-cerf-fnwxob]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'assets/**'
      - 'scripts/**'
      - 'android-signing/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Bundle the web app and create the Android project
        run: |
          node scripts/build-www.mjs
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Notification icon and permission
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_notify.xml android/app/src/main/res/drawable/ic_stat_notify.xml
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Set version from run number
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Use the fixed signing key so updates install over the old app
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk daily-driver.apk

      - uses: actions/upload-artifact@v4
        with:
          name: daily-driver-apk
          path: daily-driver.apk

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest daily-driver.apk \
            --target "${{ github.sha }}" \
            --title "Daily Driver (build ${{ github.run_number }})" \
            --notes "Latest Android build. Download daily-driver.apk and install it. Updates install over the old version and keep your data."
